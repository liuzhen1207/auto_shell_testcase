# ---------- 内存缓冲区默认参数（用例可逐条覆盖）----------
# 关键取舍：本环境堆 20G（**运维手工设置 ON_HEAP_MEMORY="20G"，非发布包默认**；
#   两版发布包默认都是"按机器内存自动算"，未设置时 RC9 实测 12.50G）、
#   datanode_memory_proportion 默认 1:5:1:1:1:1 ⇒ write≈2G、memtable≈1.9G（按 20G 堆算）。
# 直接把 memtable 写满需要 GB 级写入（TEXT 写入实测约 0.5k~2k 点/秒），单条用例不可接受。
# 因此用例统一用"缩小 memtable + 调比例"的方式把阈值压到几十 MB 量级：
#   · 缩 memtable：把 datanode_memory_proportion 的分母放大（如 1:200:1:1:1:1 ⇒ write≈100MB）；
#   · 压 flush 阈值：flush_proportion 调小；
#   · 压 reject 阈值：reject_proportion 调小（必须 <0.85，否则与 0.1+0.05 相加触发"用默认值"告警）。
# ⚠️ 不要在这里定义 MB_MEM_PROPORTION：
#    各用例自带其所需比例（如 MB-03/14 用 1:2000、MB-04/05 用 1:1000），
#    若此处先赋值，用例里的 ${MB_MEM_PROPORTION:-...} 会保留本值，导致用例比例失效
#    （实测后果：MB-03 按 1:5 运行 → 刷盘阈值不同 → 假 FAIL）。
#    如需临时覆盖，请在命令行显式传 MB_MEM_PROPORTION=... 即可。
MB_STORAGE_PROPORTION="${MB_STORAGE_PROPORTION:-8:2}"
MB_WRITE_PROPORTION="${MB_WRITE_PROPORTION:-19:1}"
MB_FLUSH_PROPORTION="${MB_FLUSH_PROPORTION:-0.4}"
MB_REJECT_PROPORTION="${MB_REJECT_PROPORTION:-0.8}"
MB_WAL_QUEUE_PROPORTION="${MB_WAL_QUEUE_PROPORTION:-0.1}"
MB_DEVICE_PATH_PROPORTION="${MB_DEVICE_PATH_PROPORTION:-0.05}"
MB_BUFFERED_ARRAYS_PROPORTION="${MB_BUFFERED_ARRAYS_PROPORTION:-0.6}"
MB_WAL_BUFFER_SIZE="${MB_WAL_BUFFER_SIZE:-33554432}"
MB_WAL_SNAPSHOT_THRESHOLD="${MB_WAL_SNAPSHOT_THRESHOLD:-8388608}"
MB_MAX_WAL_SNAPSHOT_NUM="${MB_MAX_WAL_SNAPSHOT_NUM:-1}"
MB_TIMED_FLUSH_SEQ="${MB_TIMED_FLUSH_SEQ:-true}"
MB_SEQ_FLUSH_INTERVAL="${MB_SEQ_FLUSH_INTERVAL:-600000}"
MB_SEQ_FLUSH_CHECK="${MB_SEQ_FLUSH_CHECK:-30000}"
MB_TIMED_FLUSH_UNSEQ="${MB_TIMED_FLUSH_UNSEQ:-true}"
MB_UNSEQ_FLUSH_INTERVAL="${MB_UNSEQ_FLUSH_INTERVAL:-600000}"
MB_UNSEQ_FLUSH_CHECK="${MB_UNSEQ_FLUSH_CHECK:-30000}"
MB_CHECK_PERIOD_WHEN_BLOCKED="${MB_CHECK_PERIOD_WHEN_BLOCKED:-50}"
MB_MAX_WAIT_WHEN_BLOCKED="${MB_MAX_WAIT_WHEN_BLOCKED:-10000}"
MB_IO_TASK_QUEUE_SIZE="${MB_IO_TASK_QUEUE_SIZE:-10}"
MB_PRIMITIVE_ARRAY_SIZE="${MB_PRIMITIVE_ARRAY_SIZE:-64}"

# 写入规模（TEXT 载荷越大、单点内存占用越高，越容易把 memtable 推过阈值）
MB_PAYLOAD_BYTES="${MB_PAYLOAD_BYTES:-4000}"
# ⚠️ 客户端 CLI 是单 JVM 全内存执行：一次喂 10MB SQL 会客户端 OOM，
#    单条 INSERT 超过 ~1MB 也会变慢甚至静默失败（实测 2MB/语句 52s、ok=0）。
#    因此写入一律分片：单条语句载荷 <= MB_STMT_PAYLOAD_BYTES，每次 CLI 调用喂 MB_STMTS_PER_CHUNK 条。
MB_STMT_PAYLOAD_BYTES="${MB_STMT_PAYLOAD_BYTES:-262144}"
MB_STMTS_PER_CHUNK="${MB_STMTS_PER_CHUNK:-4}"
MB_ROWS_PER_STMT="${MB_ROWS_PER_STMT:-500}"
MB_DEVS="${MB_DEVS:-4}"

