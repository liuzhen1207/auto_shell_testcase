# ============================================================================
# 树转表视图 auto_sync_schema 回归 skill —— 环境配置
#   迁移到其他环境只改本文件（或用同名环境变量覆盖）。
#   3C5D：3 ConfigNode + 5 DataNode；SchemaRegion 3 副本 / DataRegion 2 副本。
# ============================================================================

# ---------- skill 根目录（自动推导，一般不用改） ----------
SKILL_DIR="${SKILL_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)}"

# ---------- 集群访问 ----------
CN_LIST="${CN_LIST:-172.16.2.26 172.16.2.27 172.16.2.28}"
DN_LIST="${DN_LIST:-172.16.2.2 172.16.2.3 172.16.2.4 172.16.2.5 172.16.2.6}"
QUERY_HOST="${QUERY_HOST:-172.16.2.2}"
SSH_USER="${SSH_USER:-root}"
SSH_OPTS="${SSH_OPTS:--o StrictHostKeyChecking=no}"

# ---------- 版本与安装路径 ----------
NEW="${NEW:-master_1026_dc11a35}"           # /data{,1,2}/iotdb/<NEW>
CN_DIR="${CN_DIR:-/data/iotdb/$NEW}"
DN_DIR="${DN_DIR:-/data1/iotdb/$NEW}"
CLIENT_DIR="${CLIENT_DIR:-/data2/iotdb/$NEW}"
CLI="${CLI:-$CLIENT_DIR/sbin/start-cli.sh}"

# ---------- 数据面协议 ----------
PROTO="${PROTO:-org.apache.iotdb.consensus.iot.IoTConsensus}"

# ---------- 账号 ----------
DB_USER="${DB_USER:-root}"
PW="${PW:-TimechoDB@2021}"

# ---------- PLM 追溯 ----------
PLM_ITEM="${PLM_ITEM:-TDB-343}"

# ---------- 运行产物 ----------
BASE="${BASE:-$SKILL_DIR}"
RESULT_ROOT="${RESULT_ROOT:-$BASE/results}"
LOG_DIR="${LOG_DIR:-$BASE/logs}"

export SKILL_DIR CN_LIST DN_LIST QUERY_HOST SSH_USER NEW CN_DIR DN_DIR CLIENT_DIR CLI PROTO DB_USER PW PLM_ITEM BASE RESULT_ROOT LOG_DIR
