# lbac_skill 环境配置（全部可用同名环境变量覆盖）
CN_LIST="${CN_LIST:-172.16.2.26 172.16.2.27 172.16.2.28}"
DN_LIST="${DN_LIST:-172.16.2.2 172.16.2.3 172.16.2.4 172.16.2.5 172.16.2.6}"
HOST="${HOST:-172.16.2.2}"
NEW="${NEW:-v20131rc2_1110_83183d0}"
PW="${PW:-TimechoDB@2021}"
UPW="${UPW:-Lbac@1234567}"
CN_DIR="${CN_DIR:-/data/iotdb/$NEW}"
DN_DIR="${DN_DIR:-/data1/iotdb/$NEW}"
CLI="${CLI:-/data2/iotdb/$NEW/sbin/start-cli.sh}"
DB="${DB:-lb_db}"
TBL="${TBL:-t1}"
RESULT_ROOT="${RESULT_ROOT:-$BASE/results}"
KNOWN="${KNOWN:-$BASE/conf/known_failures.conf}"
export CN_LIST DN_LIST HOST NEW PW UPW CN_DIR DN_DIR CLI DB TBL RESULT_ROOT

# ---- 三权分立（separation of powers）----
SEP="${SEP:-0}"                              # 1=三权分立模式
SEC_ADMIN="${SEC_ADMIN:-security_admin}"     # LBAC / 用户 / 授权
SYS_ADMIN="${SYS_ADMIN:-sys_admin}"          # 库表 DDL
ADMIN_PW="${ADMIN_PW:-TimechoDB@2021}"
export SEP SEC_ADMIN SYS_ADMIN ADMIN_PW
