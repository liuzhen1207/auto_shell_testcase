# iot-benchmark 配置模板（由 pgkit 在运行时填充 {占位符} 后写到客户端机）
# 依据：环境侦察实测的可用键集合（zip 自带 config.properties 全被注释，有效行 0，必须自写）
# v13 包（1.3 线）只能 tree；v20 包（2.0.11 线）支持 tree/table/table_view/OBJECT

DB_SWITCH={db_switch}
IoTDB_DIALECT_MODE={dialect}
HOST={hosts}
PORT={ports}
USERNAME={username}
PASSWORD={password}
DB_NAME={db_name}
IS_DELETE_DATA=false

# 单设备 × N 测点（PROACTIVE 的不变量：测点数不增加 series slot）
DEVICE_NUMBER={device_number}
SENSOR_NUMBER={sensor_number}
GROUP_NUMBER=1
IoTDB_TABLE_NUMBER={table_number}
IoTDB_TABLE_WRITABLE_VIEW=false

SCHEMA_CLIENT_NUMBER=1
DATA_CLIENT_NUMBER={data_client_number}
BATCH_SIZE_PER_WRITE={batch_size}
DEVICE_NUM_PER_WRITE=1

LOOP=100000000
TEST_MAX_TIME={test_max_time_ms}
POINT_STEP=1000
START_TIME={start_time}

OPERATION_PROPORTION={operation_proportion}
INSERT_DATATYPE_PROPORTION={datatype_proportion}
CREATE_SCHEMA=true
