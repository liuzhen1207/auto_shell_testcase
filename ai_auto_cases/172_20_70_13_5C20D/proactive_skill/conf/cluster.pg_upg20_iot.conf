# 本包（5C20D 泄漏/多DN）不执行升级族；此文件仅为通过引擎 selftest 的 conf 契约检查而保留。
# =============================================================================
# 5C20D（5 ConfigNode + 20 DataNode，SR5 / DR3 / IoTConsensus）PROACTIVE 测试档位
#
# 定位：现有 3C5D（SR3/DR2）RegionGroup PROACTIVE 回归的**补充包**，重点覆盖
#       ① 线程泄漏 ② 内存泄漏 ③ 必须多 DN 才能验证的分布/上限/回收场景。
#
# 纪律：
#   * 本文件**不写任何集群 IP**：拓扑唯一来源是 conf/nodes.conf（engine 从那里解析
#     cn_hosts/dn_hosts，deploy 也按它分发）。所有用例代码从 conf 取值，无硬编码。
#   * 每个阈值键都给默认值；用例在 result.json / evidence 里**打印实际观测值**，
#     阈值只用于判定，不得用"没测到"代替 PASS（不可测即 SKIP，SKIP ≠ PASS）。
#   * 集群级参数（副本数、共识协议、series_slot_num、time_partition_interval）都是
#     first_start 生效：改完必须 `prepare`（停→清 data/logs→写 conf→起）。
# =============================================================================

# --- access -----------------------------------------------------------------
SSH_USER=root
SSH_PORT=22
# 目标环境给的是密码模式（root/Iotdb@2026）；有 ssh 免密时改成 key 并把密码留空
SSH_MODE=password
SSH_PASSWORD=Iotdb@2026
SSH_EXTRA_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
# 一条用例会发成百上千条 ssh：开连接复用（否则 25 台机器的防护会把客户端 IP 当爆破）。
# 25 台 × ControlPersist 会占文件句柄，保持 300s 足够。
SSH_MULTIPLEX=true
SSH_CONTROL_PERSIST=300

# --- topology ---------------------------------------------------------------
# 5 CN + 20 DN 全部来自这一行；IP 只出现在 conf/nodes.conf
NODES_FILE=conf/nodes.conf
# 集群测试路径（数据库安装目录）
DB_DIR=/data/iotdb
# 单盘部署：留空即只用 <DB_DIR>/data；双盘机器再填第二块盘的基准目录
DB_DATA_DIR_2=
DB_MULTI_DIR_STRATEGY=SequenceStrategy
CN_INTERNAL_PORT=10710
DN_INTERNAL_PORT=10730
DN_RPC_PORT=6667
# 非交互 ssh 的 PATH 里通常没有 java/jcmd/jstack：填了就用它，留空则用目标机 PATH。
# 泄漏用例会优先用 $JAVA_HOME/bin/jcmd，再退 PATH 里的 jcmd / jstack / jmap。
# 目标机 JDK 路径不同时**只改这一行**；预检脚本 preflight_5c20d.sh 会逐台报出来。
JAVA_HOME=
# 空 = 用集群自带的 start-cli.sh（经 ssh 在 cli_host 上执行），无需客户端装 CLI
CLI_HOME=
# 空 = 用 nodes.conf 里第一条 dn 记录；单机 25 角色时建议指定一台纯 CN 或纯 DN
CLI_NODE=
CLI_SUDO=auto

# --- deployment -------------------------------------------------------------
# 本包默认"库已就位、只做测试"：DEPLOY_TARBALL 留空时 `deploy` 会明确报错，
# 不做任何破坏性动作。需要本包装库时填发布包绝对路径（zip/tar.gz 均可）。
DEPLOY_TARBALL=
DEPLOY_DIR=/data
# 留空 = 拓扑取 conf/nodes.conf（避免第二处 IP 清单）
DEPLOY_HOSTS=
DEPLOY_CONSENSUS=IoTConsensus
# 集群未激活时把 DEPLOY_ACTIVATE 改 true 并填 LICENSE_CODE / LICENSE_CODE_FILE；
# 已激活的环境保持 false，避免重启时反复打激活接口。
DEPLOY_ACTIVATE=false
LICENSE_CODE=
LICENSE_ACTIVATE_TRIES=24
LICENSE_CODE_FILE=
# 各节点本地可用的 license 源文件（跨 DB_DIR 重装时用；留空表示不自动拷贝）
LICENSE_SRC=

# --- database ---------------------------------------------------------------
DB_VERSION=2.0.12
DB_USER=root
DB_PASSWORD=TimechoDB@2021
# 目标环境口径：SchemaRegion 5 副本 / DataRegion 3 副本
SCHEMA_REPLICATION_FACTOR=5
DATA_REPLICATION_FACTOR=3
# 20 DN 的机器内存必须容得下 DN_HEAP × 20；目标机内存不明时先按 8G/4G 起，
# 由 preflight 脚本核对 free -g 与堆比例（见 RUNBOOK「最容易踩的坑」）。
CN_HEAP=4G
CN_OFF_HEAP=1G
DN_HEAP=8G
DN_OFF_HEAP=2G
# 25 个 JVM 一起拉起的启动时间明显长于 3C5D；900s 是下限，别调小
CLUSTER_START_TIMEOUT_SEC=1200
CLUSTER_STOP_TIMEOUT_SEC=300

# --- PROACTIVE 策略与配额（写进 iotdb-system.properties，重启生效）-----------
# 键名逐字取自发布包模板（series_slot_num / *_region_group_extension_policy /
# default_*_region_group_num_per_database / *_region_per_data_node / time_partition_interval）
PG_SCHEMA_POLICY=PROACTIVE
PG_DATA_POLICY=PROACTIVE
PG_MIN_SCHEMA_PER_DB=1
PG_MIN_DATA_PER_DB=2
# Schema 权重：R_schema = max(min, ceil(3 × 20DN / (库数 × 5副本)))
#   1 库 → 12；2 库 → 6；4 库 → 3；20 库 → 1（多库分摊口径，MULTI-04 直接对照）
PG_SCHEMA_PER_DATA_NODE=3
# Data 权重：R_data = max(min, ceil(1 × 20DN / (库数 × 3副本)))
#   1 库 → 7；2 库 → 4；4 库 → 2；20 库 → 1
# 用整数配额（>0）而不是 0（0 = 按 CPU 核数口径），公式才不依赖目标机 CPU 上报值
PG_DATA_PER_DATA_NODE=1
# 仅在 data_region_per_data_node=0（CPU 口径）时才参与公式；本档位不生效，留作对照
PG_CPU_CORES_PER_DN=48
# 1000 槽 = 约 1/1000 概率撞槽；MULTI-06 用 50 个不同槽验证 min(K,R) 收敛
PG_SERIES_SLOT_NUM=1000
# 时间分区 7 天（毫秒）；LEAK-MEM-03 用它造多个时间分区
PG_TIME_PARTITION_INTERVAL=604800000
# 用例内使用的普通用户（无 SYSTEM 权限）与系统用户（继承用例用）
PG_NORMAL_USER=pg_normal
PG_NORMAL_PASSWORD=PgNormal@2021
PG_SYSTEM_USER=pg_system
PG_SYSTEM_PASSWORD=PgSystem@2021
# 继承的 3C5D 用例用它当隔离开关；本包的 14 条 LEAK/MULTI 用例不读 PG_TIER
PG_TIER=core

# --- benchmark（可选，用于 LEAK-MEM-04 长时间负载）--------------------------
# LEAK_MEM_LOAD_MODE=auto（默认）：BENCH_DIR 存在 + BENCH_CMD 非空才用 benchmark 加压；
# 缺任何一项 ⇒ LEAK-MEM-04 **SKIP 并写明原因**（"没测到"绝不写成 PASS）。
# LEAK_MEM_LOAD_MODE=synthetic（显式选择）：不用 benchmark，由包内合成负载写
# LEAK_MEM_LOAD_DB，同样做周期性堆采样；这是唯一允许在没有 benchmark 时继续跑的分支。
# BENCH_DIR 必须位于**执行本包的客户端机**本地（MEM-04 用本地前台进程加压）。
BENCH_DIR=/data1/iotdb/5c20dtest/benchmark
# 模板可用 {db} {minutes} 两个占位；必须在前台跑并在结束时退出
BENCH_CMD=
# benchmark 写入的库名（留空则用 LEAK_MEM_LOAD_DB）
BENCH_DB=

# --- 泄漏观测阈值（LEAK-*）--------------------------------------------------
# 动作后等"静止"再采样：建/删库与扩缩容的余波要在这个窗口内收敛，否则测到的是噪声
LEAK_SETTLE_SECONDS=30
# 采样哪些节点：all = 5 CN + 20 DN；cn / dn 只采一侧（调试用）
LEAK_SAMPLE_NODES=all
# 25 台并发 ssh 的并发度：太高会被目标机防护拦，太低一轮采样要几分钟
LEAK_SAMPLE_PARALLEL=8
# 单台 jcmd/jstack/jmap 的超时
LEAK_TOOL_TIMEOUT_SEC=180

# LEAK-THR-*：线程泄漏
LEAK_ROUNDS=20                      # THR-02 建库→写 100 设备→删库 的轮次
LEAK_DEVICES_PER_DB=100             # THR-02 每轮写入设备数（= 每库不同 slot 数）
LEAK_THREAD_SAMPLE_EVERY=5          # THR-02 每 N 轮采样一次
LEAK_THREAD_TOP_N=20                # 基线表里记录多少个高频线程名
# 判据：线程总数对轮次的线性回归斜率（条/轮）≤ 该值，且末轮 ≤ 基线 + LEAK_THREAD_MARGIN
LEAK_THREAD_SLOPE_MAX=0.5
LEAK_THREAD_MARGIN=50
# 单类线程（RegionGroup / Compaction / IoTConsensus / heartbeat / connection）同上口径
LEAK_THREAD_CAT_SLOPE_MAX=0.5
LEAK_THREAD_CAT_MARGIN=30
# THR-03：扩容→删库循环；每轮写 LEAK_THREAD_SLOTS 个不同 slot 触发扩容
LEAK_THREAD_CYCLES=5
LEAK_THREAD_SLOTS=10
# THR-04：停/启 1 台 DN 的轮次（每轮都会重连，泄漏会累积在线程数上）
LEAK_HEARTBEAT_CYCLES=2
# CN 侧心跳/连接线程允许超出基线的条数（25 节点 × 重连余量）
LEAK_CN_THREAD_MARGIN=30
# DN 侧 IoTConsensus 线程随 region 数的斜率上限（条/region）：1.0 表示"每 region 一条永久线程"
LEAK_IOT_THREADS_PER_REGION_MAX=0.5
LEAK_IOT_THREAD_MARGIN=20
# 线程名归类（逗号分隔、大小写不敏感、按"先 compaction 后 regiongroup…"的顺序匹配）
LEAK_THREAD_PATTERNS_COMPACTION=compaction,merge,tsfile
LEAK_THREAD_PATTERNS_IOTCONSENSUS=iotconsensus,consensus,regionconsensusimpl,replication
LEAK_THREAD_PATTERNS_REGIONGROUP=regiongroup,region-group,schema-region,data-region,partition
LEAK_THREAD_PATTERNS_HEARTBEAT=heartbeat
LEAK_THREAD_PATTERNS_CONNECTION=grpc,netty,rpc,connection,socket

# LEAK-MEM-*：内存泄漏（jcmd GC.run + GC.heap_info，退回 jmap -histo:live）
LEAK_HEAP_GROWTH_PCT=15             # GC 后 used heap 允许增长百分比（相对基线）
LEAK_HEAP_MARGIN_MB=256             # 允许的绝对余量（MB），小堆机器上按此下限放行
LEAK_HEAP_ROUNDS=10                 # MEM-01 建删轮次
LEAK_MEM_DEVICES=20                 # MEM-01 每轮写入设备数（不同 slot）
LEAK_HEAP_SERIES_MIN_POINTS=5       # 少于这么多点不做"单调增长"判定
LEAK_HEAP_SAMPLE_TIMEOUT_SEC=300
# MEM-02：建 N 库（每库 1 设备 1 测点）→ 删 N 库 → GC → 堆回基线
MEM_LOOP_DBS=300
# MEM-03：同一库写多个时间分区，堆增长必须与写入数据量匹配
# （每个写入点允许的 GC 后堆增长上限；12000 点 × 4096B ≈ 48MB）
LEAK_MEM_TIME_PARTITIONS=6
LEAK_MEM_POINTS_PER_PARTITION=2000
LEAK_MEM_INSERT_BATCH=200
LEAK_MEM_BYTES_PER_POINT_MAX=4096
LEAK_MEM_TSFILE_RATIO_MAX=2.0       # 预留给"多分区/单分区"对照的可选上限倍数
# MEM-04（可选）：持续负载 + 周期性采样，判"锯齿"而非单调上升
MEM_LONG_MINUTES=30
LEAK_MEM_LOAD_SAMPLE_MINUTES=5
LEAK_MEM_LOAD_MODE=auto             # auto | benchmark | synthetic
LEAK_MEM_LOAD_DB=root.leak_load
LEAK_MEM_LOAD_DEVICES=20
LEAK_MEM_LOAD_INTERVAL_SEC=1

# --- 多 DN 场景阈值（MULTI-*）-----------------------------------------------
MULTI_EXPECT_RF_SCHEMA=5            # 期望的 Schema 副本数（必须与 SCHEMA_REPLICATION_FACTOR 一致）
MULTI_EXPECT_RF_DATA=3              # 期望的 Data 副本数
# MULTI-02 均衡：每个 DN 承载的 region 副本数 max/min ≤ 该值；min=0 时改用绝对差
BALANCE_RATIO_MAX=2.0
MULTI_BALANCE_MAX_DIFF=3
# 制造负载用的库数 / 每库不同 slot 设备数（组数由 R 公式封顶，不必逐库写满）
MULTI_BALANCE_DBS=4
MULTI_BALANCE_SLOTS=6
# MULTI-04 上限公式核对：建几个库一起分摊
MULTI_CAP_DBS=2
# MULTI-05：建 N 库 → 删 N-1 库 → 只剩 1 库的 region
MULTI_DB_COUNT=20
MULTI_DB_DELETE=19
MULTI_RECLAIM_WAIT_SEC=600
# MULTI-06：单库写 N 个不同 slot，观察组数增长曲线（收敛到 min(R, N)）
MULTI_SLOT_COUNT=50
# MULTI-03：停 1 台 DN；等待心跳超时/状态可解释；恢复后等待重新均衡
MULTI_STOP_SETTLE_SEC=90
MULTI_RECOVER_WAIT_SEC=600
MULTI_POLL_INTERVAL_SEC=5

# --- 收尾三件套（每个用例自动追加，任一不过该例不得 PASS）-------------------
MONITOR_URL=
MONITOR_USER=admin
MONITOR_PASSWORD=admin
SYNC_LAG_SOURCE=auto
# DataNode 的 Prometheus 端口（engine 的 BASE_DN_PROPS 写的就是 9092）
METRICS_PORT=9092
CLUSTER_NAME=5c20d
CONSENSUS_METRIC=auto
# 25 节点的 syncLag 要 ~1 分钟才统计稳定；60s 稳定窗口 + 1800s 上限
SYNC_STABLE_SECONDS=60
SYNC_MAX_WAIT_SEC=1800
SYNC_POLL_INTERVAL_SEC=10
SYNC_STALL_POLLS=12
CONSISTENCY_CHECK=true
# both = 全在线基线 + 停 1 台 DN 再查一遍（与 3C5D 口径一致）
REPLICA_MODE=both
CONSISTENCY_STOP_NODES=1
CONSISTENCY_SETTLE_SECONDS=10
CONSISTENCY_SETTLE_TRIES=3
CONSISTENCY_QUERY_TIMEOUT_SEC=3600
CONSISTENCY_SETTLE_SEC=5
LOG_SCAN=true
# 25 个 JVM 的启动收敛期比 3C5D 长（DataNode 注册 + region 上报），归因窗口放大
CLUSTER_CONVERGENCE_WINDOW_SEC=420
LOG_SCAN_MODE=since
LOG_EXTRA_PATTERNS=
LOG_BACKUP=never

# --- 结果目录（用例/过程文件目录下的 PROACTIVE 子目录）----------------------
# /data1/iotdb/5c20dtest/testcase/PROACTIVE/results/<run_id>/cases/<CASE_ID>/
#   ├── result.json   判定与断言明细
#   ├── actions.log   每一步 SQL/动作
#   └── evidence/     线程数表、heap 表、原始 jcmd/jstack 片段、分布表
# 目录不可写时 engine 会退回 <包根>/results/<run_id> 并在 run.log 里写明原因。
RESULT_DIR=/data1/iotdb/5c20dtest/testcase/PROACTIVE/results
KEEP_SCRATCH=false

