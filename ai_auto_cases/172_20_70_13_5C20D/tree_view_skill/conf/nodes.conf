# 5C20D 节点表（唯一允许出现内网 IP 的文件；代码与其他 conf 一律从本文件取拓扑）
#
# 格式：<角色><TAB><IP>
#   角色 = cn / dn / cn+dn（同机双角色）
# 顺序有语义（engine 的约定，勿随意打乱）：
#   * 第一条 cn 记录 = seed ConfigNode（cn_seed_config_node，先启这一台）；
#   * 第一条 dn 记录 = SQL 客户端所在节点（start-cli.sh 在这台上执行）；
#   * cn 记录数 = ConfigNode 数，dn 记录数 = DataNode 数，也是收尾三件套/均衡统计的分母。
#
# 目标环境：5 ConfigNode + 20 DataNode；.100~.104 同机双角色，.105~.119 纯 DataNode。
# SchemaRegion **3** 副本 / DataRegion 3 副本 / IoTConsensus（默认协议）。
