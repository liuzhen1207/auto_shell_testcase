# ============================================================================
#  iotdb-remove-cn-dn  --  2.0.12.1 RC11 (ea4f835, 2026-10-23) 3C5D matrix
# ============================================================================
#  Copy to conf/cluster.conf and edit.  Nothing here is machine specific:
#  the only addresses you must supply are your own hosts.
#
#  Values not listed here fall back to the defaults in
#  scripts/rcdn/config.py::DEFAULTS.  Every key below is documented.
# ============================================================================

# ---------------------------------------------------------------------------
# 1. SSH access to every cluster host
# ---------------------------------------------------------------------------
SSH_USER=root
SSH_PORT=22
# key    -> public key authentication (recommended)
# password -> needs sshpass on this machine, or falls back to SSH_ASKPASS
SSH_MODE=key
SSH_PASSWORD=
SSH_EXTRA_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
# Reuse one ssh connection per host (ControlMaster).  Leave this on: without it
# a single case opens hundreds of connections and the whole matrix tens of
# thousands, all from the driver's IP, which host intrusion prevention treats
# as a brute-force attempt and blocks.
SSH_MULTIPLEX=true
# Seconds an idle master connection stays open before it is closed.
SSH_CONTROL_PERSIST=300
# A DataNode removed while stopped must NOT be able to start again (IoTDB
# refuses it and asks for the data dir to be deleted by hand).  Seconds to wait
# before concluding the restart was refused.
REMOVED_NODE_RESTART_PROBE_SEC=90
# Treat a ConfigNode procedure worker stuck this long as a remove that cannot
# finish (the ConfigNode warns every 30s).  0 disables the check.
PROCEDURE_STALL_SEC=300
# Consecutive syncLag polls (10s apart) allowed to repeat the same non-zero
# value before the gate calls it a stall.  0 disables.
SYNC_STALL_POLLS=4

# ---------------------------------------------------------------------------
# 2. Node inventory
# ---------------------------------------------------------------------------
# NODES_FILE is the authoritative inventory: one "<role><TAB><ip>" per line,
# role is cn, dn or cn+dn.  Generate it with:
#     scripts/rcdn.sh discover --from-cluster      # cluster is running
#     scripts/rcdn.sh discover --from-inventory    # cluster is stopped
# Expected shape for the reference topology: 3 cn + 5 dn (3C5D).
NODES_FILE=conf/nodes.conf

# Optional: hosts probed by `discover --from-inventory` when NODES_FILE does
# not exist yet.  Comma separated.
SEED_HOSTS=

# ---------------------------------------------------------------------------
# 3. IoTDB installation
# ---------------------------------------------------------------------------
# Installation directory, identical on every cluster host.
DB_DIR=/data/mpp_test/v20121rc11_1023_ea4f835

# Leave empty to run the cluster's own $DB_DIR/sbin/start-cli.sh over ssh.
# Set it to an IoTDB install on THIS machine to run the client locally.
CLI_HOME=
# Optional: which cluster host runs the CLI (default: first DataNode).
CLI_NODE=

# Optional: a .license file distributed to every node before start
# (TimechoDB enterprise only).  Leave empty if the nodes are already licensed.
LICENSE_SRC=

# ---------------------------------------------------------------------------
# 3b. Deployment -- only needed for `rcdn.sh deploy`
# ---------------------------------------------------------------------------
# These let the skill build the cluster itself, so the minimum you have to
# supply is: the release tarball, the hosts, an ssh user and password, and the
# path to install into.  `prepare` (stop + wipe + start) is enough once a
# cluster exists; `deploy` is for building it from nothing.
#
# The release tarball.  Either a path on THIS machine (it is uploaded to every
# host, and re-used if the size already matches) or a path that already exists
# on every host.  Leave empty to reconfigure a cluster that is already in place.
DEPLOY_TARBALL=/data/deepseek/testdb/v20121rc11_1023_ea4f835/timechodb-2.0.12.1-bin.zip
# Directory the tarball is unpacked into.  DB_DIR is the final install path and
# is authoritative, so the archive's internal directory name never has to be
# guessed: whatever single top-level directory the archive holds is moved to
# DB_DIR.
DEPLOY_DIR=/data/mpp_test/v20121rc11_1023_ea4f835_unpack

# Hosts for a FRESH deployment: comma separated, one ConfigNode and one
# DataNode per host (the usual 3C3D shape).  Only consulted when NODES_FILE does
# not exist; an existing inventory always wins, because it may describe a
# deliberately asymmetric cluster.
DEPLOY_HOSTS=11.101.10.6,11.101.10.7,11.101.10.8,11.101.10.9,11.101.10.10

# data_region_consensus_protocol_class.  This is effectiveMode: first_start --
# IoTDB refuses to change it after the first start, so it must be right before
# the cluster is ever started.  Accepts:
#   IoTConsensus     -> org.apache.iotdb.consensus.iot.IoTConsensus    (default)
#   IoTConsensusV2   -> org.apache.iotdb.consensus.iot.IoTConsensusV2
#   IoTV2            -> same as IoTConsensusV2 (shorthand)
# An unrecognised name aborts the deployment rather than silently defaulting.
DEPLOY_CONSENSUS=IoTConsensus

# Submit the activation code after the cluster is healthy.
DEPLOY_ACTIVATE=true
# The activation code itself, or a path to a file containing it.  Leave empty to
# read LICENSE_CODE_FILE, which by default is the skill repository's activation
# reference -- the single place the built-in trial code is kept, so the code is
# not duplicated here.
LICENSE_CODE=
LICENSE_CODE_FILE=/data/deepseek/ai-bug-verify/skills/timechodb-rn-verify/references/activation.md

# ---------------------------------------------------------------------------
# 4. Cluster configuration written by `prepare`
# ---------------------------------------------------------------------------
# Replication factors.  DATA_REPLICATION_FACTOR=2 with 5 DataNodes is the
# standard shape; use 1 for the low-replication cases.
DATA_REPLICATION_FACTOR=2
SCHEMA_REPLICATION_FACTOR=3

# SQL credentials used for every statement the skill issues.
DB_USER=root
DB_PASSWORD=TimechoDB@2021

# Heap sizes written into confignode-env.sh / datanode-env.sh.
CN_HEAP=2G
CN_OFF_HEAP=1G
DN_HEAP=20G
DN_OFF_HEAP=2G

CLUSTER_START_TIMEOUT_SEC=900
CLUSTER_STOP_TIMEOUT_SEC=300

# ---------------------------------------------------------------------------
# 5. iot-benchmark  (required)
# ---------------------------------------------------------------------------
# Root of the iot-benchmark install ON THIS MACHINE; must contain benchmark.sh
# and conf/config.properties.
# Database version under test, e.g. 2.0.12.1 or 1.3.4.  It selects the
# iot-benchmark build and decides whether the table model can be tested:
#   2.x -> iot-benchmark-iotdb-2.0 package, DB_SWITCH=IoTDB-200-..., tree+table+table_view
#   1.x -> iot-benchmark-iotdb-1.3 package, DB_SWITCH=IoTDB-130-..., tree ONLY
# Leave empty to infer it from DEPLOY_TARBALL (best) or DB_DIR.  An install
# directory with no dotted version cannot be inferred, and `doctor` asks for this
# to be set rather than guessing.
DB_VERSION=2.0.12.1

# iot-benchmark install directory (contains benchmark.sh, lib/, conf/).
# Fetch the build matching DB_VERSION with:
#   scripts/rcdn.sh --conf conf/cluster.conf benchmark --install
# which downloads from https://github.com/thulab/iot-benchmark/releases
BM_HOME=/data/deepseek/benchmark/bm_20260812_e158c2c_jdk17

# Which benchmark database module to use.  Leave empty to derive it from
# DB_VERSION (IoTDB-200-... for 2.x, IoTDB-130-... for 1.x); set it only to
# override that pairing deliberately.
BM_DB_SWITCH=

# false: run as DB_USER (root).  true: create BM_TREE_USER / BM_TABLE_USER with
# the privileges the tree/table workloads need.
BM_USE_DEDICATED_USERS=false
BM_USER_PASSWORD=TimechoDB@2021
BM_TREE_USER=rcdn_tree
BM_TABLE_USER=rcdn_table

# Database names.  iot-benchmark appends the group prefix, so BM_TREE_DB=test
# with GROUP_NAME_PREFIX=g_ produces root.test.g_0.
BM_TREE_DB=test
BM_TABLE_DB=usr

# Database / group / table / view naming.  iot-benchmark builds
# <prefix><db>_<group><i> for table databases and
# root.<db>.<group><i> for tree databases.
BM_TREE_GROUP_PREFIX=g_
BM_TABLE_GROUP_PREFIX=sod
BM_TABLE_PREFIX=tab_
BM_TABLE_VIEW_PREFIX=wv_

# Small by design: this skill tests correctness, not throughput.
BM_LOOP=1000
BM_DEVICE_NUMBER=100
BM_SENSOR_NUMBER=12
BM_DEVICE_NUM_PER_WRITE=1
BM_SCHEMA_CLIENT_NUMBER=1
BM_DATA_CLIENT_NUMBER=10
BM_BATCH_SIZE_PER_WRITE=1
BM_POINT_STEP=1000
BM_GROUP_NUMBER=1
BM_TAG_NUMBER=0

# Spread writes out in time so the load overlaps the remove procedure.
BM_WRITE_INTERVAL_MS=200
BM_QUERY_INTERVAL=1000

# Value sizes.  OBJECT_LENGTH drives how much object data every write
# carries, so keep it modest unless you are deliberately stressing objects.
BM_STRING_LENGTH=16
BM_OBJECT_LENGTH=131072
BM_DATA_SEED=666
# true: write at the current wall-clock time (needed for read-your-writes
# while a node is being removed); false: write from START_TIME onwards.
BM_RECORD_CURRENT_TIME=true

# Escape hatch: extra KEY=VALUE pairs applied to every workload config,
# comma separated, e.g. BM_EXTRA_CONFIG=COMPRESSOR=SNAPPY,ENCODING_TEXT=PLAIN
BM_EXTRA_CONFIG=

# Workloads: any subset of tree,table,table_view (default: all three).
BM_WORKLOADS=tree,table,table_view

# Let the load run this long before the remove statement is issued.
BM_REMOVE_AFTER_SEC=90
# true: wait for the benchmark to finish naturally; false: stop it once the
# remove + consistency stages are done.
# Leave false for remove testing: the benchmark load is interrupted on purpose
# once the removal and the sync drain are done.  Set true only if you want the
# workload to reach its own Result Matrix before the case continues.
BM_WAIT_FINISH=false
BM_MAX_RUNTIME_SEC=43200

# ---------------------------------------------------------------------------
# 6. Prometheus -- the sync-lag gate
# ---------------------------------------------------------------------------
# Empty means the sync-lag gate is SKIPPED (cases can no longer claim that
# replication converged).  Point it at the cluster's Prometheus.
MONITOR_URL=
MONITOR_USER=admin
MONITOR_PASSWORD=admin

# Where the sync-lag numbers come from:
#   auto       use MONITOR_URL when it is set, otherwise METRICS_PORT
#   prometheus always query Prometheus (MONITOR_URL)
#   metrics    always scrape each DataNode's own exporter (no Prometheus needed)
SYNC_LAG_SOURCE=auto

# DataNode metrics exporter port.  Every DataNode serves
# http://<dn>:<METRICS_PORT>/metrics with the same iot_consensus{...type="syncLag"}
# series Prometheus would scrape, so a cluster without Prometheus can still be
# gated on replication convergence.  (`metrics` mode sums the per-region
# samples per node, which is what the Prometheus query does with by(instance).)
# 0 = read dn_metric_prometheus_reporter_port from the DataNode's own conf,
# so the gate follows whatever the cluster was actually deployed with.
METRICS_PORT=0

# Reported as the `cluster` label on the metrics.  Keep it stable so that
# dashboards and Prometheus queries can tell clusters apart.
CLUSTER_NAME=defaultCluster

# auto: try the V1 metric then the V2 metric.  Or force
# iot_consensus / iot_consensus_v2.
CONSENSUS_METRIC=auto
SYNC_STABLE_SECONDS=12
SYNC_MAX_WAIT_SEC=3600
SYNC_POLL_INTERVAL_SEC=5

# ---------------------------------------------------------------------------
# 7. Waiting for procedures
# ---------------------------------------------------------------------------
# SHOW MIGRATIONS must stay empty this long before a remove counts as finished.
MIGRATION_STABLE_SECONDS=20
REMOVE_MAX_WAIT_SEC=7200

# ---------------------------------------------------------------------------
# 8. Replica consistency verification
# ---------------------------------------------------------------------------
CONSISTENCY_CHECK=true
CONSISTENCY_QUERY_TIMEOUT_SEC=3600
# Grace period after stopping a node / after restarting it.
CONSISTENCY_SETTLE_SEC=5
# Settle gate for the replica-consistency sweep itself: re-run the comparison
# until it agrees with the all-online baseline, so a replica that is still
# catching up is not reported as an inconsistency.  Raise these if the
# consistency check is flaky on a slow cluster.
CONSISTENCY_SETTLE_SECONDS=15
CONSISTENCY_SETTLE_TRIES=8

# ---------------------------------------------------------------------------
# 9. Log scanning and backup
# ---------------------------------------------------------------------------
LOG_SCAN=true
# full: scan the whole log (correct after `prepare` wipes the logs)
# since: only lines newer than the case start (useful on a long-lived cluster)
LOG_SCAN_MODE=full
# Extra ERE patterns, '|' separated, added to the built-in FAIL patterns.
LOG_EXTRA_PATTERNS=

# never | fail | always -- when to tar up the CN/DN logs
LOG_BACKUP=fail

# ---------------------------------------------------------------------------
# 10. Results and lifecycle
# ---------------------------------------------------------------------------
RESULT_DIR=/home/ubuntu/remove_cn_dn/.dsh/skills/iotdb-remove-cn-dn/results
KEEP_SCRATCH=false
# true: rebuild (wipe + restart) the cluster before every case.  Slower but
# fully isolated; required when cases change the replication factor.
RESET_CLUSTER_PER_CASE=true

# ---------------------------------------------------------------------------
# 11. Optional extras
# ---------------------------------------------------------------------------
# Benchmark errors that are recorded but kept out of the pass/fail decision,
# as a regex.  Set empty for strict mode (every error fails its case).
# The default provokes these on purpose: stopping or restarting the DataNode
# serving a statement fails it with 722 CANNOT_FETCH_FI_STATE, which R&D
# confirmed is documented behaviour.  722 has two possible texts, so the status
# code is matched as well -- an allowlist matching only one text excuses
# nothing at all (measured: 0 matches out of 190 real error lines).
EXPECTED_BENCH_ERRORS=Fetch Table Device Schema failed|CANNOT_FETCH_FI_STATE|Failed to fetch state, has retried|722:
# A ConfigRegion whose replica set loses quorum makes an outage correct
# behaviour, not a defect: the replica set IS the ConfigNode set, so its floor
# is members//2+1 and two ConfigNodes must both be up.  With this true, errors
# inside the recorded down-window are excused; set false to report them anyway
# (do that only if you have >=5 ConfigNodes, where quorum survives).
CN_BELOW_QUORUM_EXPECTED_OUTAGE=true
# Optional: a host OUTSIDE nodes.conf to grow the cluster for the `adding` case.
# Leave empty to hold back the last DataNode of nodes.conf instead -- that node is
# joined during the case and then removed, so no spare machine is required.
SPARE_DN_HOSTS=
# How many DataNodes `selector=multi` removes one after another.
# Upper bound for the dn_multi_remove case.  It is clamped to what the
# topology permits: the ConfigNode refuses any removal that would leave fewer
# than max(schema_replication_factor, data_replication_factor) DataNodes, so a
# 5-node cluster at rf=3 can only give up 2 no matter what is asked for here.
MULTI_REMOVE_COUNT=3

# Simulate a disk-full DataNode by raising its own disk_space_warning_threshold
# above the real free ratio (hot-reloaded, nothing written to the volume).  Set
# to false to refuse to touch that property; the disk-full cases then SKIP.
# The state is entered on a write attempt, so the node must be under write load.
DISK_FULL_SIMULATE=true

# Whether start-cli.sh needs sudo to find java: auto | true | false.
# `auto` tries the login user first and falls back to `sudo -n`, which is what
# a cluster with java only in root's profile needs.
CLI_SUDO=auto

# ---- RC5 (2026-10-05) 追加 ----
RESTART_CLEANUP_SETTLE_SEC=15
ABORT_ON_REPLICA_DIFF=false

# ---- RC11 (2026-10-23) 追加：多盘 OBJECT 布局 + 两个新缺陷场景 --------
# 本机两块盘：/dev/sda1 -> /，/dev/sdb1 -> /data。每个 DataNode 用两个数据目录，
# 于是每个 DN 有两个 object 目录（<data dir>/object），覆盖"对象文件分布在多块盘"的形态
# （原缺陷环境是 3 块盘，这里 2 块，判据等价：object 目录跨盘、快照/恢复要跨目录汇总）。
DN_DATA_DIRS=data/datanode/data,/mpp_ssd/v20121rc11/dn_data
# 必须在启动前创建，并且**每例 wipe 时清空**（否则上个用例的 region/OBJECT 残留会污染下一个）。
DN_EXTRA_DIRS=/mpp_ssd/v20121rc11/dn_data

# TDB-861：删除批量（删除 N 天前/30s 前的行，让 OBJECT GC 与迁移快照并发）
OBJECT_DELETE_AGE_MS=10000
# TDB-861 判据门槛：GC 删除记录少于这个数就认为并发窗口没建立（判 SKIP）
OBJECT_GC_MIN_RECORDS=20
OBJECT_GC_PRIME_TIMEOUT_SEC=660
OBJECT_DELETE_ROUNDS=5
OBJECT_DELETE_INTERVAL_SEC=2

# 激进时序（同 rc6 的 profile，缩短等待、保持检出能力）
BM_REMOVE_AFTER_SEC=90
SYNC_STABLE_SECONDS=12
SYNC_POLL_INTERVAL_SEC=5
SYNC_STALL_POLLS=4
CONSISTENCY_SETTLE_SECONDS=15
RESTART_CLEANUP_SETTLE_SEC=15

# ---- 定向复现 TDB-861 用的强化 profile ----------------------------------
# 更大的 OBJECT 体积（131072B）+ 更长预热（90s），让 OBJECT GC 有大量文件可删；
# 预热等待 300s，确保"GC 正在 unlink"与"region 快照"在时间上重叠。

# --- one OBJECT point of 4 GiB, written in chunks (TDB: per-point object limit) ---
BM_WAIT_FINISH=false
OBJECT_SINGLE_GIB=4
OBJECT_SINGLE_CHUNK_MIB=8
OBJECT_SINGLE_DB=objsingle
OBJECT_SINGLE_MIGRATE=true
OBJECT_BIG_MIGRATE=false
