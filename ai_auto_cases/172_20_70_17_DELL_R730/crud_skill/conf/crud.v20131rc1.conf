# 2.0.13.1 RC1（ab6d3de）CRUD 运行配置：本文件用于验证 RATIS-2661/TDB-372 建组窗口用例
# TTL test matrix -- TimechoDB/IoTDB 2.0.12.1 RC4 (18cf11b, 2026-09-24)
#
# Device-level TTL (设备粒度 TTL（新）) plus the V2.0.12.1 security-audit work for
# failed TTL deletion.  Same topology and constraints as the remove-cn/dn skill:
# 3 ConfigNode + 5 DataNode on the five shared hosts, data_rf=2 / schema_rf=3,
# IoTConsensus, one cluster at a time.
#
# The TTL knobs live in iotdb-common.properties and are NOT hot-reloadable, so they are
# written by `deploy`/`prepare` before the cluster starts.  Small values are deliberate:
# they make the settle/physical-delete case observable in minutes instead of hours.

# --- access -----------------------------------------------------------------
SSH_USER=root
SSH_PORT=22
SSH_MODE=key
SSH_PASSWORD=
SSH_EXTRA_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
SSH_MULTIPLEX=true
SSH_CONTROL_PERSIST=300

# --- topology ---------------------------------------------------------------
NODES_FILE=conf/nodes.conf
# 任务里提到的 RC4 安装目录是 /data/mpp_test/v20121rc4_20260924，但该目录在 .6/.9 等主机上
# 已存在且带有约 1GB 数据（属于既有安装）。直接部署会覆盖它，违反"不破坏既有配置"的约束，
# 因此本 skill 使用独立目录；两条约束冲突时以"不破坏既有环境"为准，并在报告中说明。
DB_DIR=/data/mpp_test/tdb372_v20131rc1
CLI_HOME=
CLI_NODE=
CLI_SUDO=auto

# --- deployment -------------------------------------------------------------
DEPLOY_TARBALL=/home/ubuntu/remove_cn_dn/tdb372/timechodb-2.0.13.1-bin.zip
DEPLOY_DIR=/data/mpp_test
DEPLOY_HOSTS=11.101.10.6,11.101.10.7,11.101.10.8,11.101.10.9,11.101.10.10
DEPLOY_CONSENSUS=IoTConsensus
DEPLOY_ACTIVATE=true
LICENSE_CODE_FILE=/data/deepseek/ai-bug-verify/skills/timechodb-rn-verify/references/activation.md

# --- database ---------------------------------------------------------------
DB_VERSION=2.0.13.1
DB_USER=root
DB_PASSWORD=TimechoDB@2021
DATA_REPLICATION_FACTOR=2
SCHEMA_REPLICATION_FACTOR=3
CN_HEAP=2G
CN_OFF_HEAP=1G
DN_HEAP=8G
DN_OFF_HEAP=2G
CLUSTER_START_TIMEOUT_SEC=900
CLUSTER_STOP_TIMEOUT_SEC=300

# --- TTL knobs (iotdb-common.properties) -------------------------------------
# ttl_check_interval : background TTL check period.  Default is 2h; 5s makes the
#                      settle/physical-deletion case finish inside one run.
# max_expired_time   : force cleanup once a file's devices are older than this.
# expired_data_ratio : share of fully-expired devices that selects a file.
# default_ttl_in_ms  : TTL of root.** when the user has not set one (10 years here,
#                      so nothing expires by accident and `unset root.**` is provable).
TTL_CHECK_INTERVAL_MS=5000
TTL_MAX_EXPIRED_TIME_MS=60000
TTL_EXPIRED_DATA_RATIO=0.001
TTL_DEFAULT_TTL_MS=315360000000

# --- audit log (V2.0.12.1 FAILED_TTL_DELETION) -------------------------------
# enable_audit_log defaults to false in this build, and while it is false __audit does not
# exist at all, so the audit cases could only ever report SKIP.  Turning it on is what makes
# "是否记录删除失败" a testable question.  auditable_control_event_type is deliberately NOT set
# here: the design documents disagree about whether FAILED_TTL_DELETION is in the default
# whitelist, and leaving it unset is the only way to observe the real default.
AUDIT_ENABLE=true
AUDIT_OPERATION_TYPES=DML,DDL,QUERY,CONTROL

# --- benchmark (optional load, only needed by the object-scan audit case) -----
BM_HOME=/data/deepseek/benchmark/bm_20260812_e158c2c_jdk17
BM_WORKLOADS=tree,table,table_view

# --- results ----------------------------------------------------------------
RESULT_DIR=/data/deepseek/CRUD/results
KEEP_SCRATCH=false
