# 阶段B：在 1.3 数据目录上就地覆盖安装 2.0.11（保留 data/），跑 PG-UPG-08..16
### 档位 升级：DB_DIR 独立；DEPLOY_TARBALL 为 1.3.7（升级前），PG_UPGRADE_TO_TARBALL 为 2.0.11（升级后）
# TimechoDB 2.0.11-SNAPSHOT（master commit 3bbeea656114）RegionGroup 积极扩容（PROACTIVE）回归配置
# 依据：PLM docs/360 需求分析、docs/341 技术设计、docs/127 分槽验证、RN TDB-367
# 键名与默认值来自发布包 conf/iotdb-system.properties.template 与源码核验，依据见 references/proactive-knobs.md

# --- access -----------------------------------------------------------------
SSH_USER=root
SSH_PORT=22
SSH_MODE=key
SSH_PASSWORD=
SSH_EXTRA_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
SSH_MULTIPLEX=true
SSH_CONTROL_PERSIST=300

# --- topology ---------------------------------------------------------------
NODES_FILE=conf/nodes.conf
DB_DIR=/data/mpp_test/pg_upg_13
# 双盘：/data=HDD，第二块盘（SSD）基准目录，技能自动派生 <DB_DIR 末级名>/data
DB_DATA_DIR_2=/ssd_data/mpp_test
DB_MULTI_DIR_STRATEGY=SequenceStrategy
# 5 台统一 jdk-17；非交互 ssh 下 PATH 可能没有 java，必须显式指定
JAVA_HOME=/usr/local/jdk-17.0.8
CLI_HOME=
CLI_NODE=
CLI_SUDO=auto

# --- deployment -------------------------------------------------------------
DEPLOY_TARBALL=/data/deepseek/timecho_src/master/timechodb/distribution/target/timechodb-2.0.11-SNAPSHOT-bin.zip
DEPLOY_DIR=/data/mpp_test
DEPLOY_HOSTS=11.101.10.6,11.101.10.7,11.101.10.8,11.101.10.9,11.101.10.10
DEPLOY_CONSENSUS=IoTConsensus
DEPLOY_ACTIVATE=true
LICENSE_CODE=01-AOKWIESG-HWHYRMDN-FWYDAIG5-OPLX6F2X-RKA54PUP-DCDZJXH3-3YAGKNEE-T7FISC5C-HXJ2JDOM-OZLZTEGZ-E4LWHQQ4-FDASRVZU-6VN3WZP5-EKWBCR3K-JIFSPHOV-RP2KITCM-LBHEQE3W-25NWPVN3-KVL6GKCV-KROKBM3G-KFVZRMXI-7U5LXTQB
LICENSE_ACTIVATE_TRIES=24
LICENSE_CODE_FILE=/data/deepseek/ai-bug-verify/skills/timechodb-rn-verify/references/activation.md

# --- database ---------------------------------------------------------------
DB_VERSION=2.0.11-SNAPSHOT
DB_USER=root
DB_PASSWORD=root
DATA_REPLICATION_FACTOR=2
SCHEMA_REPLICATION_FACTOR=3
CN_HEAP=2G
CN_OFF_HEAP=1G
DN_HEAP=20G
DN_OFF_HEAP=2G
CLUSTER_START_TIMEOUT_SEC=900
CLUSTER_STOP_TIMEOUT_SEC=300

# --- PROACTIVE 策略与配额（每用例按登记表覆写；写入 iotdb-system.properties，重启生效）---
PG_SCHEMA_POLICY=PROACTIVE
PG_DATA_POLICY=PROACTIVE
PG_MIN_SCHEMA_PER_DB=1
PG_MIN_DATA_PER_DB=2
PG_SCHEMA_PER_DATA_NODE=3
PG_DATA_PER_DATA_NODE=0
PG_SERIES_SLOT_NUM=1000
PG_TIME_PARTITION_INTERVAL=604800000
# 用例内使用的普通用户（无 SYSTEM 权限）与系统用户，用于热加载权限/大小写验证
PG_NORMAL_USER=pg_normal
PG_NORMAL_PASSWORD=PgNormal@2021
PG_SYSTEM_USER=pg_system
PG_SYSTEM_PASSWORD=PgSystem@2021

# --- 升级用例（1.3 → 2.0）-----------------------------------------------------
# 1.3 服务端包路径待确认；未配置时升级类用例必须 SKIP 并说明原因，不得判 PASS
PG_UPGRADE_FROM_TARBALL=/home/ubuntu/remove_cn_dn/pg_build/vendor/iotdb-enterprise-1.3.7-SNAPSHOT-bin.zip
PG_UPGRADE_FROM_VERSION=1.3

# --- benchmark 客户端 --------------------------------------------------------
PG_BENCH_SSH=liuzhen@11.101.10.11
PG_BENCH_V13_DIR=/home/liuzhen/cluster_shell_3c5d/tc2026_releasenote_testcase/benchmark/bm_20260915_46fc572_v13
PG_BENCH_V20_DIR=/home/liuzhen/cluster_shell_3c5d/tc2026_releasenote_testcase/benchmark/bm_20260915_46fc572_v20

# --- 用例筛选 ----------------------------------------------------------------
# smoke=冒烟最小集；core=核心回归；full=全量（默认 core）
PG_TIER=core

# --- 收尾三件套（收尾① sync lag / 收尾② 副本一致性 / 收尾③ 日志扫描）--------
MONITOR_URL=
SYNC_LAG_SOURCE=auto
METRICS_PORT=0
CLUSTER_NAME=PowerEdgeR730
CONSENSUS_METRIC=auto
SYNC_STABLE_SECONDS=60
SYNC_MAX_WAIT_SEC=1800
SYNC_POLL_INTERVAL_SEC=10
SYNC_STALL_POLLS=12
CONSISTENCY_CHECK=true
# 用户要求：先取全节点在线结果为基准，再逐次 stop 1 个 DataNode 查询并对比 ⇒ 默认 stop
REPLICA_MODE=both
# 收尾②口径：全在线基线（direct：逐台存活 DN 各查一遍）+ 停 N 台 DN 再查一遍
CONSISTENCY_STOP_NODES=1
CONSISTENCY_SETTLE_SECONDS=10
CONSISTENCY_SETTLE_TRIES=3
CONSISTENCY_QUERY_TIMEOUT_SEC=3600
CONSISTENCY_SETTLE_SEC=5
LOG_SCAN=true
CLUSTER_CONVERGENCE_WINDOW_SEC=300
LOG_SCAN_MODE=since
LOG_EXTRA_PATTERNS=
LOG_BACKUP=never

# --- results ----------------------------------------------------------------
RESULT_DIR=/home/ubuntu/remove_cn_dn/pg_build/results
KEEP_SCRATCH=false
PG_CPU_CORES_PER_DN=48
PG_DB_TREE=root.pg
PG_DB_TABLE=pg
PG_BENCH_PASSWORD=1qaz2wsx
PG_OMIT_POLICY_KEYS=true
PG_UPGRADE_TO_TARBALL=/data/deepseek/timecho_src/master/timechodb/distribution/target/timechodb-2.0.11-SNAPSHOT-bin.zip
PG_UPG_PHASE=post
