#!/bin/bash
# ============================================================================
# sec_skill 环境配置
# ============================================================================
# 目标版本目录（3C3D：SR=3 / DR=3）
V_TESTDB="${V_TESTDB:-v20131rc2_1110_83183d0}"
BUILD_TAG="${BUILD_TAG:-83183d0}"

export DB_PARENT_DIR="${DB_PARENT_DIR:-/data/iotdb}"
export DB_DIR="${DB_DIR:-$DB_PARENT_DIR/$V_TESTDB}"
export CLI="${CLI:-/data/iotdb/testdb/$V_TESTDB/sbin/start-cli.sh}"

# 3C3D 节点
CN_NODES="${CN_NODES:-192.168.99.77 192.168.99.78 192.168.99.79}"
DN_NODES="${DN_NODES:-192.168.99.77 192.168.99.78 192.168.99.79}"
ALL_NODES="$CN_NODES $DN_NODES"
PRIMARY="${PRIMARY:-192.168.99.77}"

# 账号
ROOT_PW="${ROOT_PW:-TimechoDB@2021}"
ADMIN_PW="${ADMIN_PW:-TimechoDB@2021}"
SEC_ADMIN="${SEC_ADMIN:-security_admin}"     # 三权分立：用户/权限/安全配置
SYS_ADMIN="${SYS_ADMIN:-sys_admin}"          # 三权分立：库表 DDL
AUDIT_ADMIN="${AUDIT_ADMIN:-audit_admin}"    # 三权分立：审计

# 模式：normal（root 通管）| sep（三权分立）| auto（探测）
SEC_MODE="${SEC_MODE:-auto}"

# 被测库/用户前缀
SEC_DB="${SEC_DB:-root.sec}"
SEC_USER_PREFIX="${SEC_USER_PREFIX:-sec_u}"

# 等待窗口
WAIT_CONF_SEC="${WAIT_CONF_SEC:-20}"
WAIT_LOGIN_SEC="${WAIT_LOGIN_SEC:-20}"
CLEANUP_WAIT_SEC="${CLEANUP_WAIT_SEC:-30}"

# 日志门禁白名单（预期内的噪声）
SEC_LOG_BENIGN="MemoryManager:285 - getOrRegisterMemoryBlock failed|ConfigExecution:223 - Failures happened during running ConfigExecution|GrpcLogAppender|Reporting ConfigNode shutdown failed|Failed appendEntr|APPEND_ENTRIES onError|Cannot find IOTDB_HOME|No need to transfer|License has been given up|Cluster is unactivated|receive remote license|Failed to CHANGE_REGION_LEADER|RatisRequestFailedException|terminates because interruption|Connection refused"
