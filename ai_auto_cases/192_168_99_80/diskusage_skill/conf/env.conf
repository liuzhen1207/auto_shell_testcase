# ============================================================================
# 磁盘占用统计 skill —— 环境配置
#   迁移到其他环境时只改本文件（或用同名环境变量覆盖）。
#   门禁用例（DU-01/DU-02）需要在"修复前版本"与"修复后版本"各跑一次，
#   切换方式：V_TESTDB=<版本目录名> bash tools/run_all.sh ...（环境变量优先于本文件）
# ============================================================================

# ---------- 集群访问 ----------
CLUSTER_NODES="${CLUSTER_NODES:-192.168.99.77 192.168.99.78 192.168.99.79}"
CN_NODES="${CN_NODES:-$CLUSTER_NODES}"
DN_NODES="${DN_NODES:-$CLUSTER_NODES}"
SSH_USER="${SSH_USER:-root}"
SSH_OPTS="${SSH_OPTS:--o BatchMode=yes -o ConnectTimeout=15}"

# ---------- 版本与安装路径 ----------
DB_PARENT_DIR="${DB_PARENT_DIR:-/data/iotdb}"                 # DN 侧安装父目录
CN_DB_PARENT_DIR="${CN_DB_PARENT_DIR:-$DB_PARENT_DIR}"        # CN 侧安装父目录
SHELL_CLIENT_DIR="${SHELL_CLIENT_DIR:-/data/iotdb/testdb}"    # 驱动机上的 shell 客户端目录
V_TESTDB="${V_TESTDB:-v20121rc6_1010_7ae8713e}"               # 版本目录名（同时是 build 标识）
BUILD_TAG="${BUILD_TAG:-$V_TESTDB}"

# ---------- 账号 ----------
DB_USER="${DB_USER:-root}"
ROOT_PW="${ROOT_PW:-TimechoDB@2021}"
CLUSTER_NAME="${CLUSTER_NAME:-timecho}"

# ---------- 副本与共识协议 ----------
SCHEMA_RF="${SCHEMA_RF:-3}"
DATA_RF="${DATA_RF:-3}"
DATA_CONSENSUS="${DATA_CONSENSUS:-IoTConsensus}"              # IoTConsensus | IoTConsensusV2

# ---------- 合并（本 skill 的核心场景参数）----------
# 只要"统计查询给 TsFile 永久加上读锁"复现，这些文件就再也拿不到写锁 ⇒ 合并卡住；
# 因此必须把合并开成"很快、很容易被触发"，才能在一个短窗口内看出来。
CMP_CANDIDATE_NUM="${CMP_CANDIDATE_NUM:-2}"      # inner_compaction_candidate_file_num（≥2 个文件即可被选）
CMP_INTERVAL_MS="${CMP_INTERVAL_MS:-1000}"       # compaction_schedule_interval_in_ms（1s 调度一次）
DU_CMP_EXTRA_CONF="${DU_CMP_EXTRA_CONF:-enable_seq_space_compaction=true,enable_unseq_space_compaction=true,enable_cross_space_compaction=false,inner_compaction_candidate_file_num=${CMP_CANDIDATE_NUM},compaction_schedule_interval_in_ms=${CMP_INTERVAL_MS}}"

# ---------- 用例规模与观察窗口 ----------
DU_DEVS="${DU_DEVS:-6}"            # 设备数
DU_ROWS="${DU_ROWS:-300}"          # 每设备写入点数
DU_FILES="${DU_FILES:-2}"          # 每阶段造几个 TsFile（= 写几批 + flush）
DU_WIN_SEC="${DU_WIN_SEC:-90}"     # 统计查询后"合并是否推进"的观察窗口（秒）
DU_MERGE_WAIT_SEC="${DU_MERGE_WAIT_SEC:-90}"   # 正向对照阶段等合并的窗口（秒）

# ---------- TTL 相关（本 skill 不使用；置成中性值，避免 TTL 任务干扰合并观测）----------
TTL_CHECK_INTERVAL_MS="${TTL_CHECK_INTERVAL_MS:-7200000}"
MAX_EXPIRED_TIME_MS="${MAX_EXPIRED_TIME_MS:-9223372036854775807}"
EXPIRED_DATA_RATIO="${EXPIRED_DATA_RATIO:-1.0}"

# ---------- 端口 / metrics ----------
DN_RPC_PORT="${DN_RPC_PORT:-6667}"
CN_INTERNAL_PORT="${CN_INTERNAL_PORT:-10710}"
CN_CONSENSUS_PORT="${CN_CONSENSUS_PORT:-10720}"
DN_INTERNAL_PORT="${DN_INTERNAL_PORT:-10730}"
DN_MPP_PORT="${DN_MPP_PORT:-10740}"
DN_SCHEMA_CONSENSUS_PORT="${DN_SCHEMA_CONSENSUS_PORT:-10750}"
DN_DATA_CONSENSUS_PORT="${DN_DATA_CONSENSUS_PORT:-10760}"
CN_METRIC_PORT="${CN_METRIC_PORT:-9091}"
DN_METRIC_PORT="${DN_METRIC_PORT:-9092}"

# ---------- 集群生命周期 ----------
# 1 = 复用目标机上的 autotest 框架脚本（clean_env/prepare_env，99.80 适用）
# 0 = 用本 skill 自带 ssh 启停逻辑（其他环境适用）
USE_FRAMEWORK="${USE_FRAMEWORK:-1}"
FRAMEWORK_DIR="${FRAMEWORK_DIR:-/data/iotdb/autotest}"
FRAMEWORK_CN_LIST="${FRAMEWORK_CN_LIST:-$FRAMEWORK_DIR/conf/confignode_3c.txt}"
FRAMEWORK_DN_LIST="${FRAMEWORK_DN_LIST:-$FRAMEWORK_DIR/conf/datanode_3d.txt}"

# ---------- 超时（秒） ----------
CLUSTER_READY_TIMEOUT="${CLUSTER_READY_TIMEOUT:-600}"
SYNC_TIMEOUT_SEC="${SYNC_TIMEOUT_SEC:-600}"
SYNC_STABLE_CHECKS="${SYNC_STABLE_CHECKS:-3}"
CLEANUP_WAIT_SEC="${CLEANUP_WAIT_SEC:-180}"
DN_DOWN_WAIT_SEC="${DN_DOWN_WAIT_SEC:-180}"
DN_RECOVER_WAIT_SEC="${DN_RECOVER_WAIT_SEC:-300}"
SQL_TIMEOUT_SEC="${SQL_TIMEOUT_SEC:-300}"

# ---------- 结果与产物 ----------
LOG_BACKUP="${LOG_BACKUP:-1}"     # 失败时打包 CN/DN 日志
